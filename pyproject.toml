[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-emt-statcom"
version = "0.1.0"
description = "Sequential PSS/E 35.6 to PSCAD 5.1.0 engineering demonstration"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "psutil>=5.9,<8"]

[project.optional-dependencies]
pscad = ["mhi-pscad==3.1.2"]
test = ["pytest>=8,<10"]

[project.scripts]
rms-emt = "rms_emt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
